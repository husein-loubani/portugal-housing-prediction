[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portugal_housing"
version = "0.2.0"
description = "Regression: Portugal Housing Price Prediction"
requires-python = ">=3.10"
# Single source of truth for the training environment. Versions are pinned to
# the tested environment so training and deployment cannot drift apart.
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "scipy==1.15.2",
    "lightgbm==4.6.0",
    "xgboost==3.2.0",
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "plotly==6.5.0",
    "duckdb==1.5.1",
    "shap==0.49.1",
    "joblib==1.5.3",
    "phik==0.12.5",
    "flaml==2.6.0",
]

[project.optional-dependencies]
serve = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "pydantic==2.13.2",
    "streamlit==1.56.0",
]
dev = [
    "pytest==9.0.2",
    "ruff",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["portugal_housing*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803"]  # N803: X/X_test is the sklearn convention

[tool.pytest.ini_options]
testpaths = ["tests"]
